name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  TOM_LOOKUP_OUTPUT_DIR: tabular-ontology-maker/json
  TOM_LOOKUP_SOURCE_DIR: src/ontologies
  TOM_LOOKUP_SOURCE_PATH: ""
  TOM_LOOKUP_SOURCE_URL: ""
  NAMECHEAP_SSH_USER: reasqjfn
  NAMECHEAP_SSH_HOST: 198.54.115.29
  NAMECHEAP_SSH_PORT: "21098"
  NAMECHEAP_DEPLOY_PATH: /home/reasqjfn/public_html

jobs:
  test-apps:
    name: Test ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - reasonlynx
          - onto-eagle
          - ontology-viewer
          - cq-ferret
          - bundler
          - tabular-ontology-maker
          - axiolotl
          - graph-analyst-playbook
          - graph-analytics
          - visual-lynx
          - ontology-compliance-diagnostic
          - iri-swapper
          - sparql-pattern-visualizer
          - ontology-tabulator
          - table-nova
          - about
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate app
        run: node scripts/validate-app.mjs "${{ matrix.app }}"

  test-service-worker:
    name: Test service worker manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate service worker asset list
        run: node scripts/validate-service-worker.mjs

  deploy:
    name: Build and deploy
    needs:
      - test-apps
      - test-service-worker
    environment:
      name: github-pages
      url: https://reasonlynx.com/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip rdflib

      - name: Regenerate Tabular Ontology Maker lookup JSON
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${TOM_LOOKUP_OUTPUT_DIR}"
          generated_any=0

          if [ -d "${TOM_LOOKUP_SOURCE_DIR}" ]; then
            while IFS= read -r -d '' ontology_file; do
              filename="$(basename "${ontology_file}")"
              stem="${filename%.*}"
              output_path="${TOM_LOOKUP_OUTPUT_DIR}/${stem}-lookup.json"
              echo "Generating ${output_path} from ${ontology_file}"
              python generate-lookup-json.py "${ontology_file}" -o "${output_path}"
              generated_any=1
            done < <(find "${TOM_LOOKUP_SOURCE_DIR}" -maxdepth 1 -type f \( -name '*.ttl' -o -name '*.rdf' -o -name '*.owl' -o -name '*.nt' -o -name '*.trig' -o -name '*.jsonld' \) -print0)
          fi

          if [ "${generated_any}" -eq 0 ]; then
            source_file=""
            temp_file=""

            if [ -n "${TOM_LOOKUP_SOURCE_URL}" ]; then
              temp_file="$(mktemp)"
              echo "Downloading lookup source from ${TOM_LOOKUP_SOURCE_URL}"
              curl -fsSL "${TOM_LOOKUP_SOURCE_URL}" -o "${temp_file}"
              source_file="${temp_file}"
            elif [ -n "${TOM_LOOKUP_SOURCE_PATH}" ] && [ -f "${TOM_LOOKUP_SOURCE_PATH}" ]; then
              source_file="${TOM_LOOKUP_SOURCE_PATH}"
            fi

            if [ -n "${source_file}" ]; then
              python generate-lookup-json.py "${source_file}" -o "${TOM_LOOKUP_OUTPUT_DIR}/bfo-cco-lookup.json"
            else
              echo "No ontology source directory or single source configured; keeping committed lookup JSON files"
            fi

            if [ -n "${temp_file:-}" ] && [ -f "${temp_file}" ]; then
              rm -f "${temp_file}"
            fi
          fi

      - name: Write Tabular Ontology Maker build info JSON
        shell: bash
        run: |
          set -euo pipefail
          built_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          mkdir -p tabular-ontology-maker/app
          cat > tabular-ontology-maker/app/build-info.json <<EOF
          {
            "ci": "github-actions",
            "commit": "${GITHUB_SHA}",
            "short_commit": "${GITHUB_SHA::7}",
            "built_at": "${built_at}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "ref": "${GITHUB_REF_NAME}"
          }
          EOF

      - name: Deploy to Namecheap over SSH
        shell: bash
        env:
          NAMECHEAP_PRIVATE_KEY: ${{ secrets.NAMECHEAP_PRIVATE_KEY }}
          NC_SSH_PASSPHRASE: ${{ secrets.NC_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [ -z "${NAMECHEAP_PRIVATE_KEY}" ]; then
            echo "NAMECHEAP_PRIVATE_KEY secret is not configured"
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "${NAMECHEAP_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/namecheap_key
          chmod 600 ~/.ssh/namecheap_key
          ssh-keyscan -p "${NAMECHEAP_SSH_PORT}" "${NAMECHEAP_SSH_HOST}" >> ~/.ssh/known_hosts

          eval "$(ssh-agent -s)"
          if [ -n "${NC_SSH_PASSPHRASE}" ]; then
            cat > ~/.ssh/askpass-namecheap.sh <<'EOF'
          #!/usr/bin/env sh
          printf '%s\n' "${NC_SSH_PASSPHRASE}"
          EOF
            chmod 700 ~/.ssh/askpass-namecheap.sh
            DISPLAY=:0 SSH_ASKPASS="${HOME}/.ssh/askpass-namecheap.sh" SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/namecheap_key </dev/null
          else
            ssh-add ~/.ssh/namecheap_key
          fi
          ssh-add -l

          SSH_OPTS="-i ~/.ssh/namecheap_key -p ${NAMECHEAP_SSH_PORT} -o IdentitiesOnly=yes -o BatchMode=yes"
          ssh ${SSH_OPTS} "${NAMECHEAP_SSH_USER}@${NAMECHEAP_SSH_HOST}" "test -d '${NAMECHEAP_DEPLOY_PATH}'"

          rsync -az --delete \
            -e "ssh ${SSH_OPTS}" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.tmp-tom-lookup-test/' \
            --exclude '.well-known/' \
            --exclude 'cgi-bin/' \
            --exclude 'node_modules/' \
            --exclude 'coverage/' \
            --exclude 'admin/coverage/' \
            --exclude 'package-lock.json' \
            ./ "${NAMECHEAP_SSH_USER}@${NAMECHEAP_SSH_HOST}:${NAMECHEAP_DEPLOY_PATH}/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
