
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Edge-Canonical Computing is a rapid ontology development landing page for explaining edge-focused ontology workflows, tooling, and applied semantic engineering services." />
  <meta name="author" content="Jonathan Vajda" />
  <meta name="dcterms.creator" content="Jonathan Vajda" />
  <meta name="dcterms.rightsHolder" content="Jonathan Vajda" />
  <meta name="license" content="GNU General Public License version 3.0" />
  <link rel="license" href="https://www.gnu.org/licenses/gpl-3.0.en.html" />
  <meta name="dcterms.license" content="https://www.gnu.org/licenses/gpl-3.0.en.html" />
  <meta name="version" content="0.1.0" />
  <title>ReasonLynx | Rapid Ontology Development via Edge-Canonical Computing</title>

  <!-- Load Skeleton first, then your app base theme layer -->
  <link rel="stylesheet" href="./docs/styles/normalize.css" />
  <link rel="stylesheet" href="./docs/styles/skeleton.css" />
  <link rel="stylesheet" href="./docs/styles/app-base.css" />

  <style>
    /* Scoped landing page styles layered on top of Skeleton + app-base.css */
    .landing-page {
      padding: 2.4rem 0 4.8rem;
      background:
        radial-gradient(circle at top left, color-mix(in srgb, var(--ont-accent) 12%, transparent), transparent 28%),
        linear-gradient(180deg, var(--ont-bg) 0%, color-mix(in srgb, var(--ont-bg) 92%, #000) 100%);
    }

    .landing-page__section {
      padding: 3.6rem 0;
    }

    .landing-page__hero {
      min-height: 88vh;
      display: flex;
      align-items: center;
    }

    .landing-page__eyebrow {
      display: inline-block;
      margin-bottom: 1.2rem;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      background: var(--ont-accent-soft);
      color: var(--ont-pill-text);
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .landing-page__title {
      margin: 0 0 1.4rem;
      font-size: clamp(3.4rem, 6vw, 5.8rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
      color: var(--ont-text);
    }

    .landing-page__lead,
    .landing-page__sublead {
      max-width: 68ch;
      margin: 0 0 1.25rem;
      color: var(--ont-muted);
      font-size: 1.9rem;
      line-height: 1.65;
    }

    .landing-page__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 2rem;
    }

    .landing-page__hero-visual {
      position: relative;
      min-height: 48rem;
      border: 1px solid var(--ont-border);
      border-radius: calc(var(--ont-radius) * 3);
      background: linear-gradient(
        145deg,
        color-mix(in srgb, var(--ont-panel-bg) 92%, white 8%),
        color-mix(in srgb, var(--ont-emph-bg) 84%, var(--ont-panel-bg))
      );
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    .landing-page__hero-visual::before {
      content: "placeholder image";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ont-muted);
      font-size: 2.2rem;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--ont-accent-soft) 75%, transparent), transparent 60%),
        repeating-linear-gradient(
          135deg,
          transparent,
          transparent 18px,
          color-mix(in srgb, var(--ont-border) 40%, transparent) 18px,
          color-mix(in srgb, var(--ont-border) 40%, transparent) 36px
        );
    }

    .landing-page__hero-note {
      position: absolute;
      right: 1.6rem;
      bottom: 1.6rem;
      width: min(30rem, calc(100% - 3.2rem));
      padding: 1.4rem 1.5rem;
      background: color-mix(in srgb, var(--ont-panel-bg) 88%, transparent);
      border: 1px solid var(--ont-border);
      border-radius: calc(var(--ont-radius) * 2);
      backdrop-filter: blur(8px);
      color: var(--ont-muted);
      font-size: 1.5rem;
      line-height: 1.55;
    }

    .landing-page__section-heading {
      max-width: 76rem;
      margin-bottom: 2.4rem;
    }

    .landing-page__section-heading h2 {
      margin: 0 0 1rem;
      font-size: clamp(2.8rem, 4vw, 4.2rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
      color: var(--ont-text);
    }

    .landing-page__section-heading p {
      margin: 0;
      color: var(--ont-muted);
      font-size: 1.8rem;
      line-height: 1.7;
    }

    .landing-page__feature-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 2rem;
    }

    .landing-page__feature-card {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      background: var(--ont-panel-bg);
      border: 1px solid transparent;
      border-radius: calc(var(--ont-radius) * 2.5);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      opacity: 0;
      transform: translateY(36px);
      transition:
        opacity 700ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 700ms cubic-bezier(0.22, 1, 0.36, 1),
        border-color 180ms ease,
        box-shadow 180ms ease;
    }

    .landing-page__feature-card.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .landing-page__feature-card:hover {
      border-color: color-mix(in srgb, var(--ont-accent) 30%, var(--ont-border));
      box-shadow: 0 24px 54px rgba(0, 0, 0, 0.12);
    }

    .landing-page__feature-card:nth-child(2) {
      transition-delay: 90ms;
    }

    .landing-page__feature-card:nth-child(3) {
      transition-delay: 180ms;
    }

    .landing-page__feature-card:nth-child(4) {
      transition-delay: 60ms;
    }

    .landing-page__feature-card:nth-child(5) {
      transition-delay: 150ms;
    }

    .landing-page__feature-card:nth-child(6) {
      transition-delay: 240ms;
    }

    .landing-page__feature-media {
      position: relative;
      min-height: 18rem;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--ont-accent-soft) 85%, transparent), transparent 65%),
        linear-gradient(160deg, color-mix(in srgb, var(--ont-panel-bg) 95%, white 5%), color-mix(in srgb, var(--ont-emph-bg) 90%, var(--ont-panel-bg)));
      border-bottom: 1px solid var(--ont-border);
    }

    .landing-page__feature-media::before {
      content: "placeholder image";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ont-muted);
      font-size: 1.5rem;
      letter-spacing: 0.03em;
    }

    .landing-page__feature-body {
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex: 1;
    }

    .landing-page__feature-title {
      margin: 0;
      font-size: 2rem;
      line-height: 1.25;
      color: var(--ont-text);
    }

    .landing-page__feature-text {
      margin: 0;
      color: var(--ont-muted);
      font-size: 1.6rem;
      line-height: 1.7;
    }

    .landing-page__topic-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 2rem;
    }

    .landing-page__topic-card {
      padding: 2rem;
      background: var(--ont-panel-bg);
      border: 1px solid var(--ont-border);
      border-radius: calc(var(--ont-radius) * 2.25);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.06);
    }

    .landing-page__topic-card h3 {
      margin: 0 0 0.9rem;
      font-size: 2rem;
      line-height: 1.25;
      color: var(--ont-text);
    }

    .landing-page__topic-card p {
      margin: 0;
      color: var(--ont-muted);
      font-size: 1.6rem;
      line-height: 1.7;
    }

    .landing-page__footer-note {
      margin-top: 1.8rem;
      color: var(--ont-muted);
      font-size: 1.4rem;
    }

    @media (max-width: 1000px) {
      .landing-page__hero {
        min-height: auto;
      }

      .landing-page__feature-grid,
      .landing-page__topic-grid {
        grid-template-columns: 1fr;
      }

      .landing-page__hero-visual {
        margin-top: 2rem;
        min-height: 36rem;
      }
    }

    @media (max-width: 640px) {
      .landing-page {
        padding-top: 1.2rem;
      }

      .landing-page__section {
        padding: 2.6rem 0;
      }

      .landing-page__lead,
      .landing-page__sublead,
      .landing-page__section-heading p,
      .landing-page__feature-text,
      .landing-page__topic-card p,
      .landing-page__hero-note {
        font-size: 1.55rem;
      }

      .landing-page__hero-note {
        right: 1rem;
        bottom: 1rem;
        width: calc(100% - 2rem);
      }
    }
  </style>
</head>
<body>
  <main class="landing-page">
    See other site.
  </main>

  <script>
    (function () {
      var cards = document.querySelectorAll('.js-reveal-card');

      if (!('IntersectionObserver' in window)) {
        cards.forEach(function (card) {
          card.classList.add('is-visible');
        });
        return;
      }

      var observer = new IntersectionObserver(function (entries, obs) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) {
            return;
          }
          entry.target.classList.add('is-visible');
          obs.unobserve(entry.target);
        });
      }, {
        threshold: 0.15,
        rootMargin: '0px 0px -40px 0px'
      });

      cards.forEach(function (card) {
        observer.observe(card);
      });
    }());
  </script>
</body>
</html>
